services:
  dagster:
    build: .
    command: dagster dev -h 0.0.0.0 -p 3000 -m pipelines.definitions
    ports: ["3000:3000"]
    volumes: [".:/app"]
    environment:
      - DOCSTREAM_DATA_DIR=/app/data
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: docstream
      MINIO_ROOT_PASSWORD: docstream-dev
    volumes: ["minio_data:/data"]
volumes:
  qdrant_data:
  minio_data:
